name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # needed for Hugo themes

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true  # blowfish needs extended for SCSS

      - name: Build
        run: hugo --minify

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # Write SSH key to a temp file
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          rsync -arvh --delete-after \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            public/* \
            $VPS_USER@$VPS_HOST:/home/petar/appdata/petarcubela/public/
